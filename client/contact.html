<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Wanderly — Plan your next trip</title>
<meta name="description" content="Send the Wanderly team a message about custom itineraries, group trips and availability." />
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Wanderly logo" />Wanderly</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="about.html">About</a></li>
      <li><a class="active" href="contact.html">Contact</a></li>
    </ul>
    <a class="btn" href="chat.html">Start chat</a>
    <button class="burger" onclick="toggleMenu()" aria-label="Toggle menu">&#9776;</button>
  </div>
  <div id="mobileMenu">
    <a href="index.html">Home</a><a href="destinations.html">Destinations</a>
    <a href="about.html">About</a><a href="contact.html">Contact</a><a href="chat.html">Start chat</a>
  </div>
</header>

<main class="wrap" style="max-width:520px;padding-top:32px">
  <h1>Contact us</h1>
  <p class="sub">We usually reply within one working day.</p>
  <form class="panel" onsubmit="submitContact(event)">
    <input class="field" required placeholder="Your name" />
    <input class="field" required type="email" placeholder="Email address" />
    <textarea class="field" required rows="5" placeholder="Where would you like to go?"></textarea>
    <button class="btn btn-block">Send message</button>
    <p class="ok" id="contactOk" hidden>Thanks — your message is queued for the team.</p>
  </form>
</main>

<footer><div class="wrap foot"><span>&copy; <span id="yr"></span> Wanderly Travel</span></div></footer>
<script src="app.js"></script>
<script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
