<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI travel assistant — Wanderly</title>
<meta name="description" content="Chat with the Wanderly AI assistant to plan routes, budgets and best travel seasons." />
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Wanderly logo" />Wanderly</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <a class="btn" href="chat.html">Start chat</a>
    <button class="burger" onclick="toggleMenu()" aria-label="Toggle menu">&#9776;</button>
  </div>
  <div id="mobileMenu">
    <a href="index.html">Home</a><a href="destinations.html">Destinations</a>
    <a href="about.html">About</a><a href="contact.html">Contact</a><a href="chat.html">Start chat</a>
  </div>
</header>

<main class="wrap" style="max-width:760px;padding-top:28px">
  <h1 class="section-title">AI travel assistant</h1>
  <p class="sub">Ask about routes, budgets, packing or the best time to travel.</p>
  <div class="chips">
    <button class="chip" onclick="askChip('Plan a 6-day Ladakh trip')">Plan a 6-day Ladakh trip</button>
    <button class="chip" onclick="askChip('Best beaches in November?')">Best beaches in November?</button>
    <button class="chip" onclick="askChip('Budget for Kerala backwaters')">Budget for Kerala backwaters</button>
  </div>
  <div class="chat-box">
    <div class="messages" id="messages">
      <div class="msg bot">Hi! I'm your Wanderly assistant. Where are you thinking of going?</div>
    </div>
    <form class="chat-form" id="chatForm" onsubmit="sendChat(event)">
      <input id="chatInput" placeholder="Type your message…" autocomplete="off" />
      <button class="btn" type="submit">Send</button>
    </form>
  </div>
</main>

<footer><div class="wrap foot"><span>&copy; <span id="yr"></span> Wanderly Travel</span></div></footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
