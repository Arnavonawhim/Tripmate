<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI travel assistant — Wanderly</title>
<meta name="description" content="Chat with the Wanderly AI assistant to plan routes, budgets and best travel seasons." />
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="styles.css" />
<style>
.chat-layout {
  display: flex;
  gap: 24px;
  padding-top: 28px;
  align-items: flex-start;
}
.sidebar {
  width: 200px;
  flex-shrink: 0;
  background: var(--card);
  border-radius: 18px;
  padding: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.sidebar h4 {
  margin: 0 0 12px 0;
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sidebar-option {
  display: block;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  margin-bottom: 8px;
  transition: all 0.2s;
  color: var(--fg);
}
.sidebar-option:hover {
  background: var(--secondary);
  border-color: var(--primary);
}
.sidebar-option.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.sidebar-option .badge {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 2px;
}
.sidebar-option.active .badge {
  color: rgba(255,255,255,0.7);
}
.chat-main {
  flex: 1;
  min-width: 0;
}
@media (max-width: 700px) {
  .chat-layout {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px;
  }
  .sidebar h4 {
    width: 100%;
    margin-bottom: 4px;
  }
  .sidebar-option {
    flex: 1;
    min-width: 100px;
    margin-bottom: 0;
    padding: 8px 12px;
    font-size: 13px;
  }
}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Wanderly logo" />Wanderly</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <a class="btn" href="chat.html">Start chat</a>
    <button class="burger" onclick="toggleMenu()" aria-label="Toggle menu">&#9776;</button>
  </div>
  <div id="mobileMenu">
    <a href="index.html">Home</a><a href="destinations.html">Destinations</a>
    <a href="about.html">About</a><a href="contact.html">Contact</a><a href="chat.html">Start chat</a>
  </div>
</header>

<main class="wrap">
  <div class="chat-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h4>Mode</h4>
      <button class="sidebar-option active" data-mode="consensus" onclick="setMode('consensus')">
        Consensus
        <span class="badge">Semantic vote &amp; judge</span>
      </button>
      <button class="sidebar-option" data-mode="stream" onclick="setMode('stream')">
        Stream
        <span class="badge">Live token streaming</span>
      </button>
      <button class="sidebar-option" data-mode="telemetry" onclick="setMode('telemetry')">
        Telemetry
        <span class="badge">Model metrics &amp; stats</span>
      </button>
    </aside>

    <!-- CHAT MAIN -->
    <div class="chat-main">
      <h1 class="section-title">AI travel assistant</h1>
      <p class="sub">Ask about routes, budgets, packing or the best time to travel.</p>
      <div class="chips">
        <button class="chip" onclick="askChip('Plan a 6-day Ladakh trip')">Plan a 6-day Ladakh trip</button>
        <button class="chip" onclick="askChip('Best beaches in November?')">Best beaches in November?</button>
        <button class="chip" onclick="askChip('Budget for Kerala backwaters')">Budget for Kerala backwaters</button>
      </div>
      <div class="chat-box">
        <div class="messages" id="messages">
          <div class="msg bot">Hi! I'm your Wanderly assistant. Where are you thinking of going?</div>
        </div>
        <form class="chat-form" id="chatForm" onsubmit="sendChat(event)">
          <input id="chatInput" placeholder="Type your message…" autocomplete="off" />
          <button class="btn" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer><div class="wrap foot"><span>&copy; <span id="yr"></span> Wanderly Travel</span></div></footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
document.getElementById("yr").textContent = new Date().getFullYear();

// Mode state
let currentMode = "consensus";

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".sidebar-option").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
  // Add mode indicator to chat
  const indicator = document.getElementById("modeIndicator") || document.createElement("div");
  if (!indicator.id) {
    indicator.id = "modeIndicator";
    indicator.style.cssText = "font-size:12px;color:var(--muted);margin-bottom:8px;padding:6px 12px;background:var(--secondary);border-radius:999px;display:inline-block;";
    document.querySelector(".chat-main .sub").after(indicator);
  }
  indicator.textContent = `⚡ Mode: ${mode.charAt(0).toUpperCase() + mode.slice(1)}`;
}
</script>
</body>
</html>
